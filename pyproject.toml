[project]
name = "ovn"
version = "0.1.0"
description = "Python ORM for Open Virtual Network"
authors = [
    { name = "Alban Siffer", email = "31479857+asiffer@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["click>=8.2.0", "pydantic-settings>=2.9.1"]
license = { text = "Apache-2.0" }

[project.optional-dependencies]
# `ovn.docker`: Docker network plugin backing networks with OVN (single host)
docker = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "pyroute2>=0.9.6"]
# `ovn.mcp`: MCP server exposing basic OVN Northbound operations
mcp = ["mcp>=2.0.0,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Package only the `ovn/` import package. Without this the sdist walks the whole
# repo (and trips over scratch files in .dev/); both targets now ship just ovn/.
[tool.hatch.build.targets.wheel]
packages = ["ovn"]

[tool.hatch.build.targets.sdist]
only-include = ["ovn"]

[dependency-groups]
dev = [
    "coverage>=7.5.0",
    "ipython>=8.36.0",
    "pytest>=8.3.5",
    "ruff>=0.15.16",
    "ty>=0.0.44",
]

[project.scripts]
ovn = "ovn.cli:entrypoint"
ovn-docker-driver = "ovn.docker:main"
ovn-mcp = "ovn.mcp_server:main"
