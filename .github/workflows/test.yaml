name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OVN_NB_DB: tcp:127.0.0.1:6641

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --dev --extra docker

      - name: Check with Ruff
        run: uv run ruff check .

      - name: Check types with ty
        run: uv run ty check

      - name: Start OVN Northbound
        run: docker compose -f docker/docker-compose.yml up --build --detach --wait --wait-timeout 120

      - name: Run tests
        run: |
          uv run coverage run -m pytest -xvs
          uv run coverage xml

      - name: Code coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          verbose: true
