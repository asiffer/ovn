name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OVN_NB_DB: tcp:127.0.0.1:6641

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --dev --all-extras

      - name: Check with Ruff
        run: uv run ruff check .

      - name: Check types with ty
        run: uv run ty check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (with layer cache)
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          tags: ovn:latest
          load: true # make the image available to `docker run` in later steps
          cache-from: type=gha
          cache-to: type=gha,mode=max # mode=max caches intermediate stages too

      - name: Start OVN Northbound
        run: docker compose -f docker/docker-compose.yml up --detach --wait --wait-timeout 120

      - name: Run tests
        run: |
          uv run coverage run -m pytest -xvs
          uv run coverage xml

      - name: Code coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          verbose: true
