services:
  ovn:
    build: .
    image: ovn:latest
    container_name: ovn
    cap_add:
      - SYS_NICE # because ovn set process niceness when using ovn-ctl start_northd and ovn-ctl start_controller
    ports:
      - 6641:6641
      - 6642:6642
    healthcheck:
      test: ["CMD", "ovsdb-client", "list-dbs", "tcp:127.0.0.1:6641"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
